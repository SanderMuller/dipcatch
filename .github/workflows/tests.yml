name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    name: tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5']
        # SQLite is the fast default; pgsql is the production engine and the
        # only place engine-specific SQL (json operators, strict grouping,
        # timestamptz) gets exercised.
        database: [sqlite, pgsql]

    # The invitation and public-product routes throttle through
    # ThrottleRequestsWithRedis, which drives a DurationLimiter straight on the
    # Redis connection and ignores CACHE_STORE. The suite needs a real server.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Always started (a matrix cannot toggle services); only the pgsql leg
      # points DB_CONNECTION at it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dipcatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, redis, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, intl
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Verify Redis Is Reachable
        run: php -r '$r = new Redis(); $r->connect("127.0.0.1", 6379); echo $r->ping(), PHP_EOL;'

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        # phpunit.xml.dist pins sqlite/:memory: unless the variables already
        # exist in the environment, so the pgsql leg exports them here.
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'dipcatch_test' || ':memory:' }}
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          HEALTH_DB_CONNECTION: ${{ matrix.database }}
          WEBPUSH_DB_CONNECTION: ${{ matrix.database }}
        run: ./vendor/bin/pest
