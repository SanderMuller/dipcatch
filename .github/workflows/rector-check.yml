name: rector-check

on:
  pull_request:
    paths:
      - '**.php'
      - 'rector.php'
      - '.github/workflows/rector-check.yml'

permissions:
  contents: read

concurrency:
  group: rector-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rector-check:
    runs-on: ubuntu-latest
    environment: Testing
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, redis
          coverage: none

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Cache Rector results
        uses: actions/cache@v6
        with:
          path: |
            .cache/rector/
            .cache/phpstan/
          key: rector-cache-${{ hashFiles('rector.php') }}
          restore-keys: rector-cache-

      - name: Ensure Rector cache directories exist
        run: mkdir -p .cache/rector .cache/phpstan

      # Rector exits 0 on a clean dry run even when it prints a warning, for example
      # about a skipped rule that no set registers. The grep fails the job on a warning.
      - name: Run Rector (dry-run)
        run: |
          set -o pipefail
          vendor/bin/rector process --dry-run 2>&1 | tee "$RUNNER_TEMP/rector.txt"
          if grep -q '\[WARNING\]' "$RUNNER_TEMP/rector.txt"; then
            echo "::error::Rector printed a warning. See the output above."
            exit 1
          fi
