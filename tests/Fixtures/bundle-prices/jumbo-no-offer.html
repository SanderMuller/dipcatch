<!doctype html>
<html lang="nl">
<body>
<main class="content">
    <div class="jum-container product-detail-wrapper">
        <div class="jum-panel accent-bottom product-panel">
            <div class="jum-grid">
                <div class="jum-grid-cell span-12 span-m-6 span-l-6 span-xl-7 product-panel-info">
                    <div class="jum-price prominent product-price" data-testid="product-price">
                        <div class="current-price">
                            <div class="screenreader-only">Prijs: € 1,99</div>
                            <span class="whole" aria-hidden="true">1</span>
                            <span class="fractional" aria-hidden="true">99</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <aside class="recommended-products">
        <div data-testautomation="pdp-promotion">
            <div data-testid="promotion-tag">2 voor 4,50</div>
        </div>
    </aside>
</main>
</body>
</html>
